name = "md2html-publish-worker"
main = "worker.js"
compatibility_date = "2024-09-01"

# Bind a KV Namespace named 'MY_KV' (100% Free, No credit card required!)
# To create via CLI: npx wrangler kv namespace create MD_SHARES
# Then replace YOUR_KV_NAMESPACE_ID below with the generated ID.
# Or bind it directly in Cloudflare Dashboard: Settings -> Variables -> KV Namespace Bindings -> MY_KV
[[kv_namespaces]]
binding = "MY_KV"
id = "MD_SHARES"
